version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:03'
      timezone: Asia/Taipei
    # Wait 7 days after a release before proposing it (supply-chain safety); security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # @types/node follows the Node 24 runtime used by CI: allow the move to 24.x, skip later majors until CI is upgraded deliberately.
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      npm-compatible:
        patterns: ['*']
        exclude-patterns: ['bc-stubs']
        update-types: [minor, patch]
    # bc-stubs and major upgrades remain separate, reviewable PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '08:03'
      timezone: Asia/Taipei
    # Wait 7 days after a release before proposing it (supply-chain safety); security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 2
