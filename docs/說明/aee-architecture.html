<style>

nt);stroke-width:3}.node{position:absolute;transform:translateY(-50%);width:190px;min-height:48px;padding:9px 11px;border:1px solid #443952;border-left:4px solid var(--node-color,var(--accent));border-radius:7px;background:var(--node);color:var(--text);text-align:left;cursor:pointer;box-shadow:0 5px 18px #0005}.node:hover,.node:focus-visible{border-color:var(--node-color);background:#2a2335}.node.root{width:165px;background:#342252;border-color:var(--accent);font-weight:650}.node .type{display:block;color:var(--node-color);font-size:10px;letter-spacing:.07em;text-transform:uppercase}.node .label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{display:grid;grid-template-columns:minmax(220px,.7fr) 1.3fr;gap:18px;margin-top:15px;padding:15px 17px;border-left:3px solid var(--detail-color,var(--accent));background:var(--panel)}.detail h3{margin:0 0 4px;font-size:16px}.detail p{margin:0;color:var(--muted)}.files{display:flex;flex-wrap:wrap;gap:7px}.files a{padding:5px 8px;border:1px solid #443952;border-radius:5px;color:#d8c9f4;text-decoration:none;font-family:ui-monospace,Consolas,monospace;font-size:12px}.files a:hover{border-color:var(--detail-color);color:var(--text)}.mobile-select{display:none;width:100%;padding:10px;background:var(--panel);border:1px solid #443952;color:var(--text);border-radius:7px}@media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid #352e42}.sidebar nav,.group-label{display:none}.mobile-select{display:block}.main{padding:18px 12px}.top{display:block}.legend{margin-top:10px}.detail{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>AEE 功能分支圖</h1><p>選擇功能，查看它連結的模組與檔案。</p></div><input id="search" class="search" type="search" placeholder="搜尋功能…" aria-label="搜尋功能"><select id="mobile-select" class="mobile-select" aria-label="選擇功能"></select><nav id="feature-list" aria-label="功能列表"></nav></aside><main class="main"><div class="top"><div><h2 id="title"></h2><p id="subtitle"></p></div><div class="legend"><span><i style="--c:var(--ui)"></i>UI</span><span><i style="--c:var(--controller)"></i>Controller</span><span><i style="--c:var(--core)"></i>Core</span><span><i style="--c:var(--hook)"></i>Hook</span><span><i style="--c:var(--storage)"></i>Storage</span></div></div><section class="graph-wrap" aria-label="功能依賴束狀圖"><div id="graph" class="graph"><svg id="edges" class="edges" aria-hidden="true"></svg></div></section><section id="detail" class="detail" aria-live="polite"></section></main></div>

 {group:'基礎系統',id:'bootstrap',name:'啟動與掛載',desc:'建立 Shadow DOM、React Root，並集中安裝所有 BC hooks。',branches:[['UI','應用程式根節點',['src/components/App.tsx']],['Core','Bootstrap',['src/main.tsx','src/app.tsx']],['Hook','Hook 安裝入口',['src/hooks/index.ts']]]},

 {group:'外觀編輯',id:'color',name:'調色盤與快速染色',desc:'HSV 調色、色彩和諧、色票、滴管與 BC 顏色寫入。',branches:[['UI','調色盤入口',['src/components/ColorPicker.tsx']],['UI','調色元件',['src/components/color-picker/ColorPickerPanel.tsx','src/components/color-picker/EyedropperOverlay.tsx','src/components/color-picker/colorMath.ts']],['Controller','顏色操作',['src/controllers/uiController.ts']],['Core','快速設定',['src/core/appearanceQuickSettings.ts']],['Core','色彩工具',['src/util/color.ts']]]},

 {group:'外觀編輯',id:'font',name:'物品字型',desc:'可編輯物品文字的字型面板、字型儲存與 BC hook。',branches:[['UI','字型面板',['src/components/main-panel/ItemFontPanel.tsx','src/components/main-panel/ItemFontSelect.tsx']],['Controller','字型控制',['src/controllers/fontController.ts']],['Storage','字型資料',['src/core/fontStore.ts','src/core/fonts.ts']],['Hook','字型 Hook',['src/hooks/fontHooks.ts']]]},
 {group:'專屬衣櫃',id:'wardrobe',name:'衣櫃畫面與服裝管理',desc:'服裝清單、搜尋、標籤、預覽、編輯與套用流程。',branches:[['UI','衣櫃舞台',['src/components/wardrobe/WardrobeScreen.tsx','src/components/wardrobe/WardrobeStage.tsx','src/components/wardrobe/Toolbar.tsx']],['UI','服裝清單',['src/components/wardrobe/OutfitGrid.tsx','src/components/wardrobe/OutfitCard.tsx','src/components/wardrobe/OutfitListPanel.tsx']],['Controller','衣櫃操作',['src/controllers/wardrobeController.ts','src/controllers/outfitsController.ts']],['Core','衣櫃 Store',['src/core/wardrobeStore.ts']],['Hook','選單整合',['src/hooks/wardrobeHooks.ts','src/hooks/menuHooks.ts']]]},

 {group:'專屬衣櫃',id:'preview',name:'衣櫃預覽與背景',desc:'獨立角色 Canvas、預覽縮放、拍照與衣櫃背景來源。',branches:[['UI','角色預覽',['src/components/wardrobe/CharacterPreview.tsx','src/components/wardrobe/CharacterCanvas.tsx','src/components/wardrobe/PreviewPanel.tsx']],['UI','背景設定',['src/components/wardrobe/dialogs/BackgroundTab.tsx','src/components/wardrobe/dialogs/GameBackgroundDialog.tsx']],['Core','Canvas 工具',['src/util/characterCanvas.ts','src/util/wardrobeBackground.ts']],['Storage','背景二進位',['src/core/backgroundImageStore.ts','src/core/indexedDb.ts']]]}

const colors={UI:'var(--ui)',Controller:'var(--controller)',Core:'var(--core)',Hook:'var(--hook)',Storage:'var(--storage)'},list=document.getElementById('feature-list'),select=document.getElementById('mobile-select'),search=document.getElementById('search'),graph=document.getElementById('graph'),edges=document.getElementById('edges'),detail=document.getElementById('detail');let active=features.find(f=>f.id==='transform');
function shortPath(path){const p=path.split('/');return p.length>2?p.slice(-2).join('/'):path}
function renderList(query=''){list.innerHTML='';select.innerHTML='';let last='',optgroup;for(const feature of features.filter(f=>(f.name+' '+f.desc+' '+f.branches.flat(2).join(' ')).toLowerCase().includes(query.toLowerCase()))){if(feature.group!==last){const label=document.createElement('div');label.className='group-label';label.textContent=feature.group;list.append(label);optgroup=document.createElement('optgroup');optgroup.label=feature.group;select.append(optgroup);last=feature.group}const button=document.createElement('button');button.className='feature-btn';button.textContent=feature.name;button.setAttribute('aria-current',String(feature===active));button.onclick=()=>choose(feature);list.append(button);const option=document.createElement('option');option.value=feature.id;option.textContent=feature.name;option.selected=feature===active;optgroup.append(option)}}
function choose(feature){active=feature;renderList(search.value);renderGraph();select.value=feature.id}
function addNode(type,label,x,y,files,isRoot=false){const b=document.createElement('button');b.className='node'+(isRoot?' root':'');b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--node-color',colors[type]||'var(--accent)');b.innerHTML='<span class="type">'+type+'</span><span class="label">'+label+'</span>';b.onclick=()=>showDetail(type,label,files);graph.append(b)}
function addPath(x1,y1,x2,y2,trunk=false){const mid=x1+(x2-x1)*.48,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`);p.setAttribute('class','edge'+(trunk?' trunk':''));edges.append(p)}
function renderGraph(){document.getElementById('title').textContent=active.name;document.getElementById('subtitle').textContent=active.desc;graph.querySelectorAll('.node').forEach(n=>n.remove());edges.innerHTML='';const rows=active.branches.reduce((n,b)=>n+Math.max(1,b[2].length),0),height=Math.max(560,rows*66+70);graph.style.height=height+'px';edges.setAttribute('viewBox',`0 0 1100 ${height}`);const rootY=height/2;addNode('功能',active.name,35,rootY,[active.name],true);let cursor=45;for(const [type,label,files] of active.branches){const block=Math.max(1,files.length)*66,branchY=cursor+block/2;addNode(type,label,330,branchY,files);addPath(200,rootY,330,branchY,true);files.forEach((file,i)=>{const y=cursor+33+i*66;addNode(type,shortPath(file),660,y,[file]);addPath(520,branchY,660,y)});cursor+=block}showDetail('功能',active.name,active.branches.flatMap(b=>b[2]))}
function showDetail(type,label,files){detail.style.setProperty('--detail-color',colors[type]||'var(--accent)');detail.innerHTML='<div><h3>'+label+'</h3><p>'+type+' · '+files.length+' 個相關檔案</p></div><div class="files">'+files.map(file=>file.startsWith('src/')?`<a href="../../${file}">${file}</a>`:`<span>${file}</span>`).join('')+'</div>'}
search.addEventListener('input',()=>renderList(search.value));select.addEventListener('change',()=>{const feature=features.find(f=>f.id===select.value);if(feature)choose(feature)});renderList();renderGraph();
</script></body></html>
