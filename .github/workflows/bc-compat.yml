name: BC compatibility

# Weekly check that the Bondage Club functions AEE hooks still match the recorded baseline.
# Drift opens one issue, updates it (with a comment) when the drift changes and closes it once everything matches
# again; it never blocks a PR or a deployment.
# The steps live in the shared workflow awdrrawd/Bondage-College-Mirror/.github/workflows/reusable-bc-compat.yml:
# it clones the mirror's bondageclub branch, runs `scripts/check-bc-compat.mjs --bc-dir <bc> --json --report <md>` and hands
# the result to `scripts/bc-compat-issue.mjs`.
# Set the repository variables BC_REPO_URL / BC_REF to use another source, or pass a branch/tag when running it by hand.
on:
  schedule:
    - cron: '7 1 * * 1' # Monday 09:07 Asia/Taipei, off the busy top of the hour
  workflow_dispatch:
    inputs:
      ref:
        description: BC branch or tag to check (empty = BC_REF variable, else the mirror's bondageclub branch)
        required: false

permissions:
  contents: read

concurrency:
  group: bc-compat
  cancel-in-progress: false

jobs:
  watch:
    permissions:
      contents: read
      issues: write
    uses: awdrrawd/Bondage-College-Mirror/.github/workflows/reusable-bc-compat.yml@main
    with:
      module: AEE
      bc-repo-url: ${{ vars.BC_REPO_URL }}
      bc-ref: ${{ inputs.ref || vars.BC_REF }}
      node-version: '24'
      check-script: scripts/check-bc-compat.mjs
      issue-script: scripts/bc-compat-issue.mjs
